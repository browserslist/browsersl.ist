name: Update
on:
  schedule:
    - cron: '0 0,12 * * *'
permissions:
  contents: none
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js & pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      - name: Install dependencies
        run: pnpm ci
      - name: Update dependencies
        run: pnpm update -r caniuse-lite browserslist browserslist-lint baseline-browser-mapping
      - name: Check dependencies
        id: changes
        run: node ./scripts/check-changes.js
      - name: Run tests
        if: steps.changes.outputs.changes
        run: pnpm test
      - name: Upload manifests
        if: steps.changes.outputs.changes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          retention-days: 1
          path: |
            pnpm-lock.yaml
            package.json
            */package.json

  push:
    name: Push
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changes
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
      - name: Download manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
      - name: Setup git config
        run: |
          git config user.name "Andrey Sitnik"
          git config user.email "andrey@sitnik.es"
      - name: Commit and push changes
        run: |
          git add pnpm-lock.yaml ':(glob)**/package.json'
          git commit -m "Update caniuse-lite and browserslist"
          git push --follow-tags
